services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lawtutor-qdrant
    restart: unless-stopped
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - lawtutor-net
    # 프로덕션: 외부 포트 노출 X (app이 내부 네트워크로 접근)

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawtutor-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bge_m3_cache:/home/lawtutor/.cache/huggingface
      - ./logs:/app/logs
    depends_on:
      - qdrant
    networks:
      - lawtutor-net
    # 프로덕션: 외부 포트 노출 X (cloudflared가 내부에서 접근)

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lawtutor-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      - app
    networks:
      - lawtutor-net

networks:
  lawtutor-net:
    driver: bridge
