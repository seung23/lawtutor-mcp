# 로컬 개발용 오버라이드.
# docker compose up 시 자동으로 머지된다.
# 프로덕션 배포 시에는 이 파일을 무시한다:
#   docker compose -f docker-compose.yml up -d
services:
  qdrant:
    ports:
      - "6333:6333"   # REST API (로컬 개발용)
      - "6334:6334"   # gRPC (로컬 개발용)

  app:
    ports:
      - "8000:8000"   # 로컬 직접 접근용
    environment:
      - QDRANT_HOST=qdrant  # .env는 localhost이지만 Docker 내부에서는 qdrant

  cloudflared:
    # 로컬 개발 시 Tunnel 불필요 → 시작하지 않음
    profiles:
      - tunnel
